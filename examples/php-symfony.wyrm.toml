# PHP/Symfony project layout
[session]
name = "symfony"
root = "."

[[windows]]
name = "editor"

  [[windows.splits]]
  command = "nvim"

  [[windows.splits]]
  type = "h"          # split right: log tail, 30%
  size = 30
  command = "# logs: tail -f var/log/dev.log"

[[windows]]
name = "server"

  [[windows.splits]]
  command = "symfony serve"

  [[windows.splits]]
  type = "h"
  size = 50
  command = "# test runner"

[[windows]]
name = "db"

  [[windows.splits]]
  command = "# docker-compose up -d postgres"
