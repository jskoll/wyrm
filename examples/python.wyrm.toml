# Python project layout
[session]
name = "python"
root = "."

[[windows]]
name = "editor"

  [[windows.splits]]
  command = "nvim"

  [[windows.splits]]
  type = "h"          # split right: a shell for one-off commands, 30%
  size = 30
  command = "# venv: source venv/bin/activate"

[[windows]]
name = "test"

  [[windows.splits]]
  command = "pytest -v --tb=short"

  [[windows.splits]]
  type = "v"          # split below: half the height
  size = 50
  command = "# coverage or lint"

[[windows]]
name = "repl"

  [[windows.splits]]
  command = "python"
