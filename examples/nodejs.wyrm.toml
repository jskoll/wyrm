# Node.js project layout
[session]
name = "node"
root = "."

[[windows]]
name = "dev"

  [[windows.splits]]
  command = "nvim"

  [[windows.splits]]
  type = "h"          # split right: the watcher gets 35% of the width
  size = 35
  command = "# watch: npm run build -- --watch"

[[windows]]
name = "server"

  [[windows.splits]]
  command = "npm run dev"

[[windows]]
name = "tests"

  [[windows.splits]]
  command = "npm test -- --watch"

  [[windows.splits]]
  type = "h"
  size = 50
  command = "# lint check"
