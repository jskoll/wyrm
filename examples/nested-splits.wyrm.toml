# Example config with a nested splits layout
# Demonstrates pre_window (interpreter setup), hooks, and startup window
# Run with: wyrm -config nested-splits.wyrm.toml

[session]
name = "myproject"
root = "."
# Run setup before session creation (pull code, install deps, etc)
on_project_start = "git pull && npm install"
# Run cleanup when session is killed
on_project_exit = "npm run cleanup"
# Focus the "editor" window when session starts
startup_window = "editor"
startup_pane = 0

[[windows]]
name = "editor"
# Run nvm setup in all panes before their commands (useful with Node, Python, Ruby, etc)
pre_window = "nvm use 18"

  # The first entry has no type, so it lands in the window's own first pane.
  # Give the first entry a type and it would split that pane instead, leaving
  # it as an empty shell — wyrm warns when a config does that.
  [[windows.splits]]
  command = "nvim"

  [[windows.splits]]
  type = "h"          # split right: this pane gets 30% of the width
  size = 30

    # children subdivide the pane above, so these two share that 30% column.
    [[windows.splits.children]]
    command = "npm test -- --watch"

    [[windows.splits.children]]
    type = "v"
    size = 50
    command = "# logs"

[[windows]]
name = "server"
pre_window = "nvm use 18"

  [[windows.splits]]
  command = "npm run dev"

  [[windows.splits]]
  type = "h"
  size = 40
  command = "# monitoring"

[[windows]]
name = "git"

  [[windows.splits]]
  command = "lazygit"

  [[windows.splits]]
  type = "v"          # split below: 40% of the height
  size = 40
  command = "git log --oneline"
