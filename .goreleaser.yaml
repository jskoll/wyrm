# Release automation: .github/workflows/release.yml runs this on version tags
# once the repo is public.
#   git tag v0.1.0 && git push --tags
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*
      - man/wyrm.1
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Sign checksums.txt so `wyrm selfupdate` can tell "this download wasn't
# corrupted" from "this release came from us". The public half is committed at
# internal/selfupdate/signing.pub and compiled into the binary; only the secret
# key is a release secret, supplied as MINISIGN_KEY_FILE (a path) with its
# password in MINISIGN_PASSWORD.
#
# A release fails outright if these are unset. That is deliberate: the previous
# arrangement had verification code with no key and no signing step, so it
# silently verified nothing in every shipped build.
signs:
  - cmd: minisign
    args:
      - "-Sm"
      - "${artifact}"
      - "-s"
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - "-x"
      - "${signature}"
    signature: "${artifact}.minisig"
    artifacts: checksum
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"

nfpms:
  - id: wyrm
    package_name: wyrm
    vendor: jskoll
    homepage: https://github.com/jskoll/wyrm
    maintainer: "Jason Skollingsberg <jskoll@users.noreply.github.com>"
    description: "Repeatable tmux session layouts from a TOML config"
    license: MIT
    formats: [deb, rpm]
    section: utils
    recommends:
      - tmux
    contents:
      - src: completions/wyrm.bash
        dst: /usr/share/bash-completion/completions/wyrm
      - src: completions/_wyrm
        dst: /usr/share/zsh/site-functions/_wyrm
      - src: completions/wyrm.fish
        dst: /usr/share/fish/vendor_completions.d/wyrm.fish
      - src: man/wyrm.1
        dst: /usr/share/man/man1/wyrm.1
      - src: LICENSE
        dst: /usr/share/doc/wyrm/LICENSE
      - src: README.md
        dst: /usr/share/doc/wyrm/README.md

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

brews:
  - repository:
      owner: jskoll
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jskoll/wyrm
    description: "Repeatable tmux session layouts from a TOML config"
    license: MIT
    install: |
      bin.install "wyrm"
      bash_completion.install "completions/wyrm.bash" => "wyrm"
      zsh_completion.install "completions/_wyrm"
      fish_completion.install "completions/wyrm.fish"
      man1.install "man/wyrm.1"
