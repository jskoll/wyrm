name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install tmux (for integration tests)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - run: go build ./...
      # -race on top of the normal run: the TUI and picker both fan work out to
      # goroutines (tea.Cmd closures, the picker's key reader), so a data race
      # is a real possibility rather than a theoretical one.
      - run: go test -race -v ./...
      # The Makefile advertises `make test-unit` as the no-tmux path, so prove
      # it still works: a test that only passes because tmux happens to be
      # installed is one that fails for the next contributor without it.
      - name: Unit tests only (-short)
        run: go test -short ./...
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
          ./.github/scripts/check-coverage.sh coverage.out

  # Build the release artifacts on every PR, so a broken .goreleaser.yaml is
  # caught here instead of at tag time when it is most expensive to discover.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --snapshot --clean --skip=publish
      # test-rpm-install and test-arch-install install from these artifacts, so a
      # packaging mistake (missing file in `contents:`, a bad `depends`) is caught
      # here rather than at tag time on a real release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The .rpm from the nfpm block (see .goreleaser.yaml) is only ever
  # exercised by `dnf install` for real at release time otherwise — this
  # installs the snapshot build's .rpm on Fedora and checks the result runs.
  test-rpm-install:
    name: Install snapshot .rpm on Fedora
    needs: release-dry-run
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: dnf install the built rpm
        run: |
          set -euo pipefail
          rpm_file="$(ls dist/*.rpm | grep -v -E 'aarch64|arm64')"
          dnf install -y --nogpgcheck "$rpm_file"
      - name: Smoke test the installed package
        run: |
          set -euo pipefail
          wyrm version
          test -f /usr/share/man/man1/wyrm.1
          test -f /usr/share/bash-completion/completions/wyrm
          rpm -q --recommends wyrm | grep -qi tmux

  # Same idea for the AUR side: build packaging/aur/PKGBUILD with makepkg
  # against this run's snapshot tarball (a local file:// source, standing in
  # for the real GitHub release URL the tag-time job fills in) and install it,
  # so a broken PKGBUILD is caught on every PR instead of at the next release.
  test-arch-install:
    name: Build and install PKGBUILD on Arch
    needs: release-dry-run
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The archlinux Docker image's pacman.conf sets NoExtract on
      # usr/share/man/* (and similar docs) for every package, to keep the
      # image small — a real Arch install doesn't have this, so without
      # removing it here the smoke test's man-page check would fail for an
      # environment reason that has nothing to do with the PKGBUILD.
      - name: Let this image actually install man pages
        run: sed -i '/^NoExtract/d' /etc/pacman.conf
      # actions/checkout needs git, which base-devel doesn't include. Full
      # -Syu (not just -Sy) here so the later dependency install makepkg -s
      # triggers for tmux isn't a partial upgrade against a stale image.
      - name: Install git
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Point the PKGBUILD at this run's snapshot tarball
        run: |
          set -euo pipefail
          tarball="$(ls dist/wyrm_*_linux_amd64.tar.gz | head -1)"
          sha="$(sha256sum "$tarball" | awk '{print $1}')"
          sed \
            -e "s/^pkgver=.*/pkgver=0.0.0/" \
            -e "s#^source_x86_64=.*#source_x86_64=(\"wyrm-bin-0.0.0-x86_64.tar.gz::file://${GITHUB_WORKSPACE}/${tarball}\")#" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sha}')/" \
            packaging/aur/PKGBUILD > PKGBUILD
      - name: makepkg -si (must run as a non-root user)
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -si --noconfirm"
      - name: Smoke test the installed package
        run: |
          set -euo pipefail
          wyrm version
          # makepkg's default `zipman` option gzips man pages during
          # packaging, so match by prefix rather than the exact filename.
          find /usr/share/man/man1 -maxdepth 1 -name 'wyrm.1*' | grep -q .
          test -f /usr/share/bash-completion/completions/wyrm
          pacman -Q tmux

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # Deleting a package can orphan a dependency, and nothing else notices:
      # removing internal/picker left golang.org/x/term in go.mod through a
      # whole release. An untidy go.mod is cosmetic, but it is also the kind of
      # thing that should never need a human to spot.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum

  # Dependabot bumps modules on a schedule, but a vulnerability disclosed
  # against a version already pinned here would otherwise go unnoticed until
  # the next bump. govulncheck reports only advisories that reach code wyrm
  # actually calls, so it stays quiet unless there is something to do.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        # GOTOOLCHAIN=auto because the scanner's own go directive has run ahead
        # of wyrm's: x/vuln needs Go 1.25+, setup-go installs exactly the version
        # in go.mod, and it also sets GOTOOLCHAIN=local — which forbids fetching
        # the newer toolchain the tool asks for. "auto" lets Go download one just
        # to run the scanner; wyrm itself stays buildable on the go.mod version,
        # which is the whole point of not simply bumping it.
        #
        # Pinned rather than @latest so a release upstream can't break CI on a
        # day nobody touched this repo — which is exactly how it broke. The
        # advisory data is fetched live regardless, so a pinned tool is not a
        # stale one.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
